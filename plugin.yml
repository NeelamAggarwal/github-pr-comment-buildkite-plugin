name: GitHub PR Comment
description: Post a comment to a GitHub pull request, including PRs that live in a different repository than the running build.
author: https://github.com/NeelamAggarwal
requirements:
  - bash
  - curl
  - jq or python3
configuration:
  properties:
    comment:
      type: string
      description: Literal markdown body to post. Mutually exclusive with comment-path.
    comment-path:
      type: string
      description: Path to a file whose contents are posted as the comment body, read at runtime. Mutually exclusive with comment.
    reply-path:
      type: string
      description: Path to a file whose contents are added to an existing sticky comment on later runs (sticky true, edit-append/edit-latest strategies), leaving the original header untouched. Read at runtime.
    pr:
      type: string
      description: Pull request number to comment on. Defaults to $BUILDKITE_PULL_REQUEST.
    repo:
      type: string
      description: Target repository as "owner/name" or a git/https URL. Defaults to $BUILDKITE_PULL_REQUEST_REPO.
    token-env:
      type: string
      description: Name of the environment variable holding the GitHub token. Defaults to GITHUB_TOKEN.
    expand:
      type: boolean
      description: When true, expand $VAR references in the comment body using the runtime environment (requires envsubst).
    sticky:
      type: boolean
      description: When true, edit a single comment in place across runs instead of posting a new one each time. Editing does not send GitHub notifications.
    sticky-key:
      type: string
      description: Identifier used to distinguish independent sticky comments on the same PR. Defaults to "default".
    sticky-strategy:
      type: string
      enum:
        - edit-append
        - edit-latest
        - replace
      description: How a sticky comment is updated on later runs. "edit-append" (default) edits in place silently, appending reply-path below the existing body (full history). "edit-latest" edits in place silently, keeping the header but only the newest reply-path. "replace" posts a new comment and deletes the previous one, so only the latest remains and every run notifies (reply-path unused).
    notify-label:
      type: string
      description: When set, force the "replace" strategy (which notifies) only if the target PR carries this label; otherwise the configured sticky-strategy is used unchanged. Requires sticky true. Lets notifications be opt-in per PR.
  additionalProperties: false
